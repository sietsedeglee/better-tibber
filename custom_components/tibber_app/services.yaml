clear_departure_times:
  name: Clear departure times
  description: >-
    Remove the Tibber Smart Charging departure time from the selected vehicle
    departure-time entities. Entities that already have no departure time are
    skipped.
  target:
    entity:
      integration: tibber_app
      domain: time

set_departure_schedule:
  target:
    device:
      integration: tibber_app
      model: Electric Vehicle
  fields:
    schedule:
      required: false
      example: '{"friday": "07:30", "monday": null}'
      selector:
        object:
    clear_all:
      required: false
      default: false
      selector:
        boolean:
    smart_charging:
      required: false
      selector:
        boolean:
